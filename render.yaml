services:
  # ── Backend: FastAPI / Uvicorn ───────────────────────────────────────────────
  - type: web
    name: geomine-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: ENVIRONMENT
        value: production

      - key: DEBUG
        value: "false"

      - key: PROJECT_NAME
        value: "Mining Document Intelligence API"

      - key: API_VERSION
        value: v1

      - key: API_HOST
        value: "0.0.0.0"

      - key: CORS_ORIGINS
        sync: false

      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite

      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001

      - key: DATABASE_URL
        sync: false

      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      - key: UPLOAD_DIRECTORY
        value: ./storage/uploads

      - key: PROCESSED_DIRECTORY
        value: ./storage/processed

      - key: FAISS_INDEX_PATH
        value: ./storage/faiss_index/mining_docs.index

      - key: FAISS_METADATA_PATH
        value: ./storage/faiss_index/mining_docs_metadata.pkl


  # ── Frontend: React / Vite → Static Site ────────────────────────────────────
  - type: web
    name: geomine-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist

    routes:
      # SPA fallback
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_BASE_URL
        sync: false