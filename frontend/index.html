<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f1e8" />
    <title>GeoMine Intelligence | Mining Document Intelligence Platform</title>
    <meta
      name="description"
      content="AI-powered geological, mining and reporting intelligence platform for CMPDI and Coal India Limited subsidiaries."
    />
    <!-- Theme pre-initialization to eliminate flash of wrong theme -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('geomine-theme');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
    <!-- Typography: Manrope (Headings), IBM Plex Sans (Body), IBM Plex Mono (Technical/Data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
